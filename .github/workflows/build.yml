name: Build NotchIsland

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Use the newest Xcode on the runner so Liquid Glass (macOS 26 SDK) is compiled in.
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version
          swift --version

      - name: Build app and DMG
        run: ./build.sh --no-open

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland
          path: build/NotchIsland.dmg

      - name: Publish release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NotchIsland.dmg
